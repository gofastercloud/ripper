[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ripper"
version = "1.0.0"
description = "Rip, compress & organize physical media"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "rich>=13.0",
    "Pillow>=10.0",
]

[project.scripts]
ripper = "ripper.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]
